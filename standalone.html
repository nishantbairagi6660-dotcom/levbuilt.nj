                          <option value="Kitchen Remodeling">Kitchen Remodeling</option>
                          <option value="Bathroom Renovation">Spa Bathroom Renovation</option>
                          <option value="Whole-Home Remodel">Whole-Home Renovation</option>
                          <option value="Custom Millwork">Custom Millwork & Trim</option>
                          <option value="General Contracting">General Contracting</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] uppercase tracking-wider text-lightText mb-1">Target Budget Tier</label>
                        <select 
                          value={formData.investmentRange}
                          onChange={(e) => setFormData({...formData, investmentRange: e.target.value})}
                          className="w-full bg-midnight border border-white/20 rounded-xl px-3 py-2 text-xs text-pureWhite focus:outline-none focus:border-mutedBronze"
                        >
                          <option value="$50,000 – $100,000">$50,000 – $100,000</option>
                          <option value="$100,000 – $250,000">$100,000 – $250,000</option>
                          <option value="$250,000 – $500,000">$250,000 – $500,000</option>
                          <option value="$500,000+">$500,000 +</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] uppercase tracking-wider text-lightText mb-1">Notes / Description</label>
                      <textarea 
                        rows="2"
                        placeholder="Brief summary of what you are looking to remodel..."
                        value={formData.details}
                        onChange={(e) => setFormData({...formData, details: e.target.value})}
                        className="w-full bg-midnight border border-white/20 rounded-xl px-3.5 py-2 text-sm text-pureWhite placeholder:text-lightText/40 focus:outline-none focus:border-mutedBronze"
                      ></textarea>
                    </div>

                    <button 
                      type="submit"
                      className="w-full bg-pureWhite text-midnight hover:bg-mutedBronze hover:text-pureWhite py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition-all mt-2"
                    >
                      Submit Consultation Request ↗
                    </button>

                    <div className="pt-2 text-center">
                      <a 
                        href={`tel:${BUSINESS_INFO.phoneRaw}`}
                        className="text-xs text-mutedBronze hover:text-pureWhite font-medium"
                      >
                        Prefer speaking directly? Call {BUSINESS_INFO.phone}
                      </a>
                    </div>
                  </form>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
